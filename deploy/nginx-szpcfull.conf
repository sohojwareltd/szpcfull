# Install: sudo cp deploy/nginx-szpcfull.conf /etc/nginx/sites-available/szpcfull
#          sudo ln -sf /etc/nginx/sites-available/szpcfull /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Laravel app runs in Docker (deploy/docker-compose.yml) on 127.0.0.1:8080
# App root on VPS: /var/www/szpcfull

server {
    listen 80;
    listen [::]:80;
    server_name szpc.ugv.edu.bd;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

