# Install:
#   sudo cp deploy/nginx-szpcfull.conf /etc/nginx/sites-available/szpcfull
#   sudo ln -sf /etc/nginx/sites-available/szpcfull /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Same pattern as UGVOS: host nginx + PHP-FPM (no Docker required).
# App root on VPS: /var/www/szpcfull
# Adjust fastcgi_pass if your socket differs (ls /run/php/).

server {
    listen 80;
    listen [::]:80;
    server_name szpc.ugv.edu.bd;

    root /var/www/szpcfull/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        # Alternatives if 8.5 socket is missing:
        # fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

