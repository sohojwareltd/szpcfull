# Run from repo deploy/ folder (works for ~/szpcfull or /var/www/szpcfull):
#   cd ~/szpcfull/deploy && docker compose up -d
#
# Public site: https://szpc.ugv.edu.bd (nginx proxies to 127.0.0.1:8080)

services:
  app:
    image: webdevops/php-nginx:8.3-alpine
    container_name: szpcfull
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ..:/app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 64M
    working_dir: /app
